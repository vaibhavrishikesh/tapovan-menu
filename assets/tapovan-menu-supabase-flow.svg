<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F4EA"/>
      <stop offset="0.5" stop-color="#EEF7F0"/>
      <stop offset="1" stop-color="#E4F3EC"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12352C"/>
      <stop offset="1" stop-color="#168457"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#11372E" flood-opacity="0.18"/>
    </filter>
    <style>
      .title{font:850 68px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;letter-spacing:-2px;fill:#102E26}
      .subtitle{font:500 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#526A62}
      .eyebrow{font:750 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#168457}
      .boxTitle{font:800 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#102E26}
      .boxText{font:500 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#586D66}
      .whiteTitle{font:850 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:white}
      .whiteText{font:520 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#DBF2E9}
      .chip{font:800 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;letter-spacing:1px;text-transform:uppercase;fill:white}
      .small{font:650 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#49615A}
      .arrow{stroke:#168457;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12" fill="none" stroke="#168457" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1350" cy="145" r="180" fill="#B9E7CB" opacity="0.35"/>
  <circle cx="210" cy="820" r="230" fill="#F1D57C" opacity="0.22"/>

  <text x="110" y="100" class="eyebrow">Recommended MVP architecture</text>
  <text x="110" y="178" class="title">Tapovan Menu + Supabase flow</text>
  <text x="110" y="222" class="subtitle">No heavy VPS needed for the first demo: Next.js handles the app, Supabase handles live data, auth and storage.</text>

  <rect x="110" y="275" width="1380" height="530" rx="42" fill="white" filter="url(#shadow)"/>

  <g transform="translate(155 335)">
    <rect width="260" height="160" rx="28" fill="#FFF8E6" stroke="#F2D37B" stroke-width="2"/>
    <text x="32" y="52" font-size="40">📱</text>
    <text x="32" y="92" class="boxTitle">Customer</text>
    <text x="32" y="123" class="boxText">Scans QR and opens</text>
    <text x="32" y="149" class="boxText">live cafe menu</text>
  </g>

  <path d="M435 415 H535" class="arrow" marker-end="url(#arrow)"/>

  <g transform="translate(555 315)">
    <rect width="300" height="200" rx="30" fill="#EAF8F0" stroke="#78C99A" stroke-width="2"/>
    <text x="32" y="54" font-size="40">⚡</text>
    <text x="32" y="96" class="boxTitle">Next.js app</text>
    <text x="32" y="128" class="boxText">Public menu pages</text>
    <text x="32" y="154" class="boxText">Admin dashboard</text>
    <text x="32" y="180" class="boxText">API routes / server actions</text>
  </g>

  <path d="M875 415 H985" class="arrow" marker-end="url(#arrow)"/>

  <g transform="translate(1005 300)">
    <rect width="330" height="230" rx="32" fill="url(#green)"/>
    <text x="34" y="58" font-size="44">🟢</text>
    <text x="34" y="102" class="whiteTitle">Supabase</text>
    <text x="34" y="137" class="whiteText">Postgres database</text>
    <text x="34" y="164" class="whiteText">Auth / staff login</text>
    <text x="34" y="191" class="whiteText">Storage for menu photos</text>
    <text x="34" y="218" class="whiteText">Realtime updates later</text>
  </g>

  <g transform="translate(155 590)">
    <rect width="260" height="150" rx="28" fill="#EEF2FF" stroke="#9FB1FF" stroke-width="2"/>
    <text x="32" y="50" font-size="40">🧑‍🍳</text>
    <text x="32" y="88" class="boxTitle">Staff admin</text>
    <text x="32" y="119" class="boxText">Marks ingredient or</text>
    <text x="32" y="145" class="boxText">dish unavailable</text>
  </g>

  <path d="M435 665 H535" class="arrow" marker-end="url(#arrow)"/>
  <path d="M705 535 V585" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1010 555 C920 630 890 680 785 680 H555" class="arrow" marker-end="url(#arrow)" opacity="0.55"/>

  <g transform="translate(555 600)">
    <rect width="330" height="150" rx="28" fill="#FFF1EE" stroke="#F0A092" stroke-width="2"/>
    <text x="32" y="50" font-size="40">🍽️</text>
    <text x="32" y="88" class="boxTitle">Availability rules</text>
    <text x="32" y="119" class="boxText">Paneer missing → paneer</text>
    <text x="32" y="145" class="boxText">dishes become sold out</text>
  </g>

  <g transform="translate(980 610)">
    <rect width="355" height="130" rx="28" fill="#F6FAF7" stroke="#B9D7C6" stroke-width="2"/>
    <text x="32" y="48" class="boxTitle">Stored live data</text>
    <text x="32" y="82" class="boxText">cafes · menus · dishes · ingredients</text>
    <text x="32" y="110" class="boxText">availability · scans · photos</text>
  </g>

  <path d="M1165 545 V590" class="arrow" marker-end="url(#arrow)"/>

  <rect x="110" y="850" width="1380" height="78" rx="28" fill="#102E26"/>
  <text x="155" y="899" class="chip">MVP recommendation</text>
  <text x="375" y="899" class="whiteText">Start on Supabase Free for demo/pilot. Move to Pro when real paid cafes need uptime, backups and scale.</text>
</svg>
